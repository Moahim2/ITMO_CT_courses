syntax = "proto3";

package com.academy.fintech.application;

import "google/protobuf/empty.proto";

option java_multiple_files = true;

service TransferService{
  rpc Execute(TransferRequest) returns (google.protobuf.Empty) {}
  rpc NotifyTransferCompletion(NotifyingCompletionRequest) returns (google.protobuf.Empty) {}
}

message TransferRequest{
  string agreementId = 1;
  string amount = 2;
}

message NotifyingCompletionRequest{
  string agreementId = 1;
  string date = 2;
}

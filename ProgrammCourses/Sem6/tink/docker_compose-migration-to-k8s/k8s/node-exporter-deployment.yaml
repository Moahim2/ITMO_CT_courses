apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: node-exporter-pvc1
  name: node-exporter-pvc1
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: node-exporter-pvc2
  name: node-exporter-pvc2
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: node-exporter-pvc3
  name: node-exporter-pvc3
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: node-exporter
  name: node-exporter
spec:
  ports:
    - name: app-node-exporter
      port: 9100
      targetPort: 9100
  selector:
    app: node-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: node-exporter
  name: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        network/monitoring: "true"
        app: node-exporter
    spec:
      containers:
        - args:
            - --path.procfs=/host/proc
            - --path.rootfs=/rootfs
            - --path.sysfs=/host/sys
            - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
          image: prom/node-exporter:latest
          name: node-exporter
          ports:
            - containerPort: 9100
          volumeMounts:
            - mountPath: /host/proc
              name: node-exporter-pvc1
              readOnly: true
            - mountPath: /host/sys
              name: node-exporter-pvc2
              readOnly: true
            - mountPath: /rootfs
              name: node-exporter-pvc3
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: node-exporter-pvc1
          persistentVolumeClaim:
            claimName: node-exporter-pvc1
            readOnly: true
        - name: node-exporter-pvc2
          persistentVolumeClaim:
            claimName: node-exporter-pvc2
            readOnly: true
        - name: node-exporter-pvc3
          persistentVolumeClaim:
            claimName: node-exporter-pvc3
            readOnly: true

